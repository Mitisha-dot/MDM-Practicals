<!DOCTYPE html>
<html>
<head>
    <title>Interactive FAQ</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-400 flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-96">

        <h2 class="text-2xl font-bold text-center text-purple-600 mb-6">
            Placement FAQ Portal
        </h2>

        <p class="text-center mb-5 text-gray-600">
            Frequently Asked Questions
        </p>

        <!-- FAQ 1 -->
        <div class="mb-3">
            <button class="question w-full text-left p-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-white rounded">
                How can I register for placements?
            </button>

            <p class="answer hidden p-3 bg-purple-50">
                Register through the college placement portal.
            </p>
        </div>

        <!-- FAQ 2 -->
        <div class="mb-3">
            <button class="question w-full text-left p-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-white rounded">
                Where can I check placement drives?
            </button>

            <p class="answer hidden p-3 bg-purple-50">
                Check the placement portal or notice board.
            </p>
        </div>

        <!-- FAQ 3 -->
        <div class="mb-3">
            <button class="question w-full text-left p-3 bg-gradient-to-r from-cyan-500 to-purple-500 text-white rounded">
                What are the eligibility criteria?
            </button>

            <p class="answer hidden p-3 bg-purple-50">
                It depends on the company's requirements.
            </p>
        </div>

    </div>


    <script>

        // Get all questions
        let questions = document.querySelectorAll(".question");

        // Add click event to each question
        questions.forEach(function(question) {

            question.addEventListener("click", function() {

                // Get the answer
                let answer = question.nextElementSibling;

                // Show / Hide answer
                answer.classList.toggle("hidden");

            });

        });

    </script>

</body>
</html>
