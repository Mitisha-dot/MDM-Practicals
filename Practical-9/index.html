<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal To-Do List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-300 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">

        <h1 class="text-2xl font-bold text-center mb-5">
            Personal To-Do List
        </h1>

        <div class="flex gap-2 mb-4">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
                class="border border-gray-300 rounded-lg p-2 flex-1"
            >

            <button
                onclick="addTask()"
                class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                Add
            </button>

        </div>

        <ul id="taskList" class="space-y-2"></ul>

    </div>


    <script>

        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value;

            if (task == "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.className =
                "flex justify-between items-center bg-gray-100 p-2 rounded";

            li.innerHTML = `
                <span onclick="completeTask(this)" 
                      class="cursor-pointer">
                    ${task}
                </span>

                <button onclick="deleteTask(this)"
                        class="bg-red-500 text-white px-2 py-1 rounded">
                    Delete
                </button>
            `;

            document.getElementById("taskList").appendChild(li);

            input.value = "";
        }


        function completeTask(element) {

            element.classList.toggle("line-through");
            element.classList.toggle("text-gray-500");

        }


        function deleteTask(button) {

            button.parentElement.remove();

        }

    </script>

</body>
</html>
